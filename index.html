<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Track your 5-day machine hypertrophy routine with progressive overload, rest timers, and superset pacing.">
  <title>5-Day Machine Lifting Tracker</title>
  <link rel="stylesheet" href="styles.css?v=33">
  <link rel="stylesheet" href="workout-flow.css?v=33">
  <link rel="stylesheet" href="insights.css?v=33">
  <link rel="stylesheet" href="warmups.css?v=33">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon">🏋️‍♂️</div>
        <div>
          <h1 class="brand-title">Machine Master</h1>
          <div class="brand-subtitle">Hypertrophy Routine (5-Day Split)</div>
        </div>
      </div>

      <nav class="nav-tabs">
        <button class="nav-btn active" data-view="workout">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3 9v6m15-8v10m3-8v6M6 12h12"/></svg> Workout
        </button>
        <button class="nav-btn" data-view="analytics">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M7 15l4-5 4 3 5-7"/></svg> Progress
        </button>
        <button class="nav-btn" data-view="routine">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18m12-18v18M3 8h6m6 8h6"/><circle cx="6" cy="8" r="2"/><circle cx="18" cy="16" r="2"/></svg> Routine
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-container">

    <!-- WORKOUT VIEW -->
    <section id="workoutView">

      <!-- Day Selector Carousel/Grid -->
      <div class="day-selector-wrap">
        <div class="day-selector" id="daySelector">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>

      <!-- Combined progress and exercise overview -->
      <section class="session-bar" aria-label="Session progress and overview">
        <div class="session-info" id="sessionInfo"></div>
        <div class="session-actions-group">
          <div class="wake-lock-status-badge" id="wakeLockBadge" title="Screen awake status"><span class="wake-dot">●</span> Screen awake</div>
          <button class="finish-btn" id="finishWorkoutBtn">Finish workout</button>
        </div>
      </section>

      <!-- Exercise Cards List -->
      <div id="exerciseList">
        <!-- Exercise cards populated dynamically by app.js -->
      </div>
    </section>

    <!-- ANALYTICS & PROGRESS VIEW -->
    <section id="analyticsView" style="display: none;">
      <div id="analyticsContent">
        <!-- Populated dynamically -->
      </div>
    </section>

    <!-- ROUTINE / SETTINGS VIEW -->
    <section id="routineView" style="display: none;">
      <div id="routineEditor">
        <!-- Populated dynamically -->
      </div>
    </section>

  </main>

  <aside class="workout-dock" aria-label="Next set and rest timer">
  <!-- Persistent Now-Lifting Dock -->
  <div class="now-lifting-dock" id="nowLiftingDock" style="display: none;">
    <div class="now-lifting-left">

      <div class="now-lifting-title" id="nowLiftingTitle">Next Lift</div>
      <div class="now-lifting-meta" id="nowLiftingMeta">Set 1</div>
    </div>
    <button type="button" class="now-lifting-jump-btn" id="nowLiftingJumpBtn">Next set</button>
  </div>

  <!-- Floating Rest Timer Dock -->
  <div class="rest-timer-dock" id="timerDock">
    <div class="timer-progress-bar" id="timerProgressBar"></div>
    <div class="timer-content">
      <div class="timer-left">
        <span class="timer-icon">⏱️</span>
        <div>
          <div class="timer-display" id="timerDisplay" aria-label="Rest time remaining">2:00</div>
          <div class="timer-label">Rest Countdown</div>
        </div>
      </div>
      <div class="timer-controls">
        <button class="timer-btn" id="timerMinus30Btn">-30s</button>
        <button class="timer-btn" id="timerPlus30Btn">+30s</button>
        <button class="timer-btn skip-btn" id="timerSkipBtn">Skip</button>
      </div>
    </div>
    <p class="timer-minimum-status" id="timerMinimumStatus" aria-live="off"></p>
  </div>

  </aside>

  <!-- Workout Summary Modal -->
  <div class="modal-backdrop" id="summaryModal" role="dialog" aria-modal="true" aria-labelledby="summaryModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="summaryModalTitle">Session Completed</h3>
        <button class="close-modal-btn" aria-label="Close modal">&times;</button>
      </div>
      <div id="summaryContent">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Exercise / Machine Swap Modal -->
  <div class="modal-backdrop" id="swapModal" role="dialog" aria-modal="true" aria-labelledby="swapModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h3 id="swapModalTitle">🔄 Equipment Swap</h3>
          <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">Machine taken or broken? Select an alternative:</div>
        </div>
        <button class="close-modal-btn" id="closeSwapModalBtn" aria-label="Close modal">&times;</button>
      </div>
      <div id="swapContent">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Quick History Modal -->
  <div class="modal-backdrop" id="quickHistoryModal" role="dialog" aria-modal="true" aria-labelledby="quickHistoryTitle">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h3 id="quickHistoryTitle">📈 Exercise Performance Log</h3>
          <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">Past weights, reps, and all-time records</div>
        </div>
        <button class="close-modal-btn" id="closeQuickHistoryModalBtn" aria-label="Close modal">&times;</button>
      </div>
      <div id="quickHistoryContent">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Hidden file input for backup restore -->
  <input type="file" id="importFileInput" accept=".json,application/json" style="display: none;">

  <!-- Scripts -->
  <script src="routine-data.js?v=33"></script>
  <script src="app.js?v=33"></script>
  <script src="accessibility.js?v=33"></script>
  <script src="update-manager.js?v=33"></script>
</body>
</html>
